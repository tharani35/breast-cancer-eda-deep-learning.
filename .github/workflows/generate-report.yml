name: Regenerate EDA outputs and report

on:
  push:
    branches: [main]
    paths:
      - "breast_cancer_eda_mlp.py"
      - "requirements.txt"
      - "report.md"
      - ".github/workflows/generate-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate EDA charts and model results
        run: python breast_cancer_eda_mlp.py

      - name: Install report conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer

      - name: Build Word and PDF report with code appendix
        run: |
          cp report.md report_build.md
          printf '\n\n## Appendix B. Complete Python Source Code\n\n' >> report_build.md
          sed 's/^/    /' breast_cancer_eda_mlp.py >> report_build.md
          pandoc report_build.md --standalone --toc --number-sections --resource-path=.:outputs -o report.docx
          mkdir -p /tmp/report-convert
          libreoffice --headless --convert-to pdf --outdir /tmp/report-convert report.docx
          cp /tmp/report-convert/report.pdf report.pdf
          rm -f report_build.md

      - name: Commit regenerated visualizations and report files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs report.docx report.pdf
          if git diff --cached --quiet; then
            echo "No generated output changes to commit."
          else
            git commit -m "Regenerate EDA visualizations and report"
            git push origin HEAD:main
          fi
